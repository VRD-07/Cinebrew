<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBrew Playground</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #161922;
      --border: #282c3c;
      --accent: #e5a93c; /* Cinematic warm gold */
      --accent-hover: #f5b94c;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --console-bg: #090b10;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    .brand span {
      color: var(--accent);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select, button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    select:hover, button:hover {
      border-color: var(--accent);
    }

    .run-btn {
      background: var(--accent);
      color: #1a1400;
      border: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .run-btn:hover {
      background: var(--accent-hover);
    }

    .run-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Main Workspace */
    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      height: calc(100vh - 57px);
    }

    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .pane:last-child {
      border-right: none;
    }

    .pane-header {
      background: var(--panel);
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    textarea#editor {
      flex: 1;
      background: var(--bg);
      color: #f0f6fc;
      border: none;
      padding: 16px;
      font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      white-space: pre;
    }

    pre#output {
      flex: 1;
      background: var(--console-bg);
      color: #38ef7d;
      padding: 16px;
      margin: 0;
      font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: #232734;
      color: var(--text-dim);
    }

    .status-badge.ready { color: #38ef7d; }
    .status-badge.running { color: #e5a93c; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      🎬 <span>CineBrew</span> Playground
    </div>
    <div class="controls">
      <select id="presetSelect">
        <option value="hello">Example: Hello World</option>
        <option value="factorial">Example: Factorial (Recursion)</option>
        <option value="loop">Example: Loop Counter</option>
      </select>
      <button id="runBtn" class="run-btn" disabled>
        ▶ Run Code
      </button>
    </div>
  </header>

  <div class="workspace">
    <!-- Editor Pane -->
    <div class="pane">
      <div class="pane-header">
        <span>Source Code (.cb)</span>
        <span id="compilerStatus" class="status-badge">Loading Wasm VM...</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Write CineBrew code here..."></textarea>
    </div>

    <!-- Output Pane -->
    <div class="pane">
      <div class="pane-header">
        <span>Terminal Output</span>
        <span id="execTime" class="status-badge">0 ms</span>
      </div>
      <pre id="output">Initializing C++ Virtual Machine...</pre>
    </div>
  </div>

  <!-- Load the Emscripten generated JS wrapper -->
  <script src="cinebrew.js"></script>
  <script>
    // Sample presets
    const PRESETS = {
      hello: `# CINEBREW - Hello World\nPOUR "Hello, World!";\n`,
      factorial: `# CINEBREW - Factorial Example\nSCENE factorial(n) {\n    IF n <= 1 {\n        SHOT 1;\n    }\n    SHOT n * factorial(n - 1);\n}\n\nTAKE n = 5;\nTAKE result = factorial(n);\n\nPOUR "Factorial of ";\nPOUR n;\nPOUR " = ";\nPOUR result;\n`,
      loop: `# CINEBREW - Loop Example\nTAKE count = 1;\n\nLOOP count <= 5 {\n    POUR "Count is: ";\n    POUR count;\n   count = count + 1;\n}\n\nPOUR "Cut! That's a wrap.";\n`
    };

    let cinebrewModule = null;
    const runBtn = document.getElementById("runBtn");
    const editor = document.getElementById("editor");
    const output = document.getElementById("output");
    const compilerStatus = document.getElementById("compilerStatus");
    const execTime = document.getElementById("execTime");
    const presetSelect = document.getElementById("presetSelect");

    // Initialize with default preset
    editor.value = PRESETS.hello;

    presetSelect.addEventListener("change", (e) => {
      if (PRESETS[e.target.value]) {
        editor.value = PRESETS[e.target.value];
      }
    });

    // Support Tab indentation in textarea
    editor.addEventListener("keydown", function(e) {
      if (e.key === "Tab") {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
      }
    });

    // Keyboard shortcut: Ctrl+Enter (or Cmd+Enter) to run
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        if (!runBtn.disabled) runCode();
      }
    });

    runBtn.addEventListener("click", runCode);

    function runCode() {
      if (!cinebrewModule) return;

      compilerStatus.textContent = "Executing...";
      compilerStatus.className = "status-badge running";
      output.textContent = "";

      const code = editor.value;
      const t0 = performance.now();

      try {
        // Call our C++ runCineBrew function directly via Embind!
        const result = cinebrewModule.runCineBrew(code);
        const t1 = performance.now();

        output.textContent = result || "[Program executed with no output]";
        execTime.textContent = (t1 - t0).toFixed(2) + " ms";
      } catch (err) {
        output.textContent = "Execution Error: " + err;
      } finally {
        compilerStatus.textContent = "Ready";
        compilerStatus.className = "status-badge ready";
      }
    }

    // Initialize the WebAssembly Module
    async function init() {
      try {
        cinebrewModule = await createCineBrewModule();
        compilerStatus.textContent = "Ready";
        compilerStatus.className = "status-badge ready";
        output.textContent = "CineBrew C++ VM Ready. Click 'Run Code' or press Ctrl+Enter.\n";
        runBtn.disabled = false;
      } catch (err) {
        compilerStatus.textContent = "Failed to load";
        output.textContent = "Failed to initialize WebAssembly:\n" + err;
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
